<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DINO LVL 1 | TOTORINA</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090716;color:#fff;font-family:system-ui,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#090716e6,#090716ed),url('studio-totorina.png') center/cover;z-index:-1}header,main{width:min(1050px,92%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:28px 0;gap:16px}a{color:#6bd6ff}h1{font-size:clamp(2rem,6vw,4rem);margin:30px 0 10px}h1 span{color:#ff32c8}p{color:#c7c2d8}.panel,.group{background:#17132bcf;border:1px solid #ffffff2c;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 8px 40px #0005}input,textarea{background:#090716;color:#fff;border:1px solid #5d5377;border-radius:10px;padding:12px;font:inherit;max-width:100%;width:100%}textarea{min-height:72px}label{display:block;margin:12px 0 6px;color:#e3ddf1}button,.btn{background:linear-gradient(110deg,#ff32c8,#7547ff);border:0;color:#fff;padding:12px 18px;border-radius:10px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{filter:brightness(1.15)}button.alt{background:#34304c}button.danger{background:#772a50}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.group h2{margin-top:0}.dino{padding:12px 0;border-top:1px solid #ffffff24;display:flex;justify-content:space-between;gap:12px;align-items:center}.dino small{color:#b5b0ca}.muted{color:#b5b0ca;font-size:.9rem}.group-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.group-form .wide{grid-column:1/-1}@media(max-width:650px){.group-form{grid-template-columns:1fr}.group-form .wide{grid-column:auto}.dino{align-items:flex-start;flex-direction:column}}
</style></head><body><header><strong>🦖 TOTORINA • TRIBU ZOMBI</strong><a class="btn" href="index.html">← Retour au site</a></header><main><h1>DINO <span>LVL 1</span></h1><p>Crée tes groupes de dinos et ajoute tes créatures ARK. Les données restent sur cet appareil : exporte-les pour les sauvegarder.</p><section class="panel"><h2>➕ Nouveau groupe</h2><form id="new-group" class="row"><input id="group-name" maxlength="80" required placeholder="Ex. Rex, Carcha, Giga, Wyverns…" aria-label="Nom du groupe"><button type="submit">Créer le groupe</button></form></section><section class="panel"><div class="row"><button type="button" id="export">⬇ Exporter mes groupes</button><label class="btn" for="import">⬆ Importer une sauvegarde</label><input id="import" type="file" accept="application/json,.json" hidden></div><p class="muted">Les groupes ne sont pas partagés automatiquement avec les visiteurs du site.</p></section><div id="groups"></div></main><script>
const key='totorina_dino_lvl1_v1';let groups=[];try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))groups=old}catch(e){}const save=()=>{try{localStorage.setItem(key,JSON.stringify(groups))}catch(e){alert('Sauvegarde impossible dans ce navigateur. Exporte tes données.')}};const el=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);function render(){const root=document.getElementById('groups');root.replaceChildren();if(!groups.length)root.append(el('p','Aucun groupe pour le moment. Crée ton premier groupe !','muted'));for(const g of groups){const card=el('section',undefined,'group');const head=el('div',undefined,'row');head.append(el('h2','🦕 '+g.name));const del=el('button','Supprimer le groupe','danger');del.type='button';del.onclick=()=>{if(confirm('Supprimer ce groupe et tous ses dinos ?')){groups=groups.filter(x=>x.id!==g.id);save();render()}};head.append(del);card.append(head);const form=el('form',undefined,'group-form');const name=el('input');name.placeholder='Nom du dino (ex. Rex)';name.required=true;name.maxLength=100;const level=el('input');level.type='number';level.min='1';level.max='100000';level.placeholder='Niveau';const notes=el('textarea');notes.placeholder='Notes (statistiques, couleur, sexe…)';notes.className='wide';const add=el('button','Ajouter ce dino');add.type='submit';form.append(name,level,notes,add);form.onsubmit=e=>{e.preventDefault();g.dinos.push({id:uid(),name:name.value.trim(),level:level.value,notes:notes.value.trim()});save();render()};card.append(form);for(const d of g.dinos){const line=el('div',undefined,'dino');const info=el('div');info.append(el('strong',d.name+(d.level?' • Niveau '+d.level:'')));if(d.notes)info.append(el('div',d.notes,'muted'));const remove=el('button','Retirer','alt');remove.type='button';remove.onclick=()=>{g.dinos=g.dinos.filter(x=>x.id!==d.id);save();render()};line.append(info,remove);card.append(line)}root.append(card)}}document.getElementById('new-group').onsubmit=e=>{e.preventDefault();const field=document.getElementById('group-name');const name=field.value.trim();if(!name)return;groups.push({id:uid(),name,dinos:[]});field.value='';save();render()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(groups,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='totorina-dino-lvl-1-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(g=>typeof g.name==='string'&&Array.isArray(g.dinos)))throw Error('Format incorrect');if(!confirm('Remplacer les groupes actuels par cette sauvegarde ?'))return;groups=data.map(g=>({id:uid(),name:g.name.slice(0,80),dinos:g.dinos.filter(d=>d&&typeof d.name==='string').map(d=>({id:uid(),name:d.name.slice(0,100),level:String(d.level||'').slice(0,8),notes:String(d.notes||'').slice(0,1000)}))}));save();render()}catch(err){alert('Fichier de sauvegarde invalide')}finally{e.target.value=''}};render();
</script></body></html>
